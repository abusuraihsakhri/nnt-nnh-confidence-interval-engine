name: CI and Pages
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents nnt_calc.py cli.py
      - name: Run Python regression suite
        run: python -m pytest -q
      - name: Test browser JavaScript
        run: |
          node --check app.js
          node --test tests/test_web.cjs
      - name: Verify HMAC and tamper detection with ephemeral key
        run: |
          python - <<'PY'
          import os, secrets
          os.environ["AUDIT_SECRET_KEY"] = secrets.token_urlsafe(48)
          from agents.base import AuditTrail
          log = AuditTrail()
          log.log("test", "ci", "verification", {"status": "OK"})
          assert log.verify_integrity()
          log.logs[-1]["payload_hash"] = "tampered"
          assert not log.verify_integrity()
          PY

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html app.js _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
